version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez
        columns:
          - name: date_date
            description: puchase date
          - name: orders_id
            description: foreign key to ship
          - name: pdt_id
            description: foreign key to product
          - name: revenue
            description: the amount paid to purchase the product
          - name: quantity
            description: the quantity of products purchased for a given order
#        tests:
#          - unique:
#              column_name: "(orders_id || '-' || pdt_id)"
#          - dbt_utils.unique_combination_of_columns:
#              combination_of_columns:
#                - orders_id
#                - pdt_id
      - name: product
        identifier: raw_gz_product
        description: Products of Greenweez
        columns:
          - name: products_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: purchse_price
            description: the purchase price of the product
      - name: ship
        identifier: raw_gz_ship
        description: shipping data for Greenweez orders
        columns:
          - name: orders_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: the price of shipping
          - name: logcost
            description: the cost of preparing the parcel
          - name: ship_cost
            description: shipping cost paid by Greenweez to the logistics provider